name: CI/CD Pipeline - Pruebas Automatizadas

on:
  push:
    branches:
      - main
      - master
      - test/pruebas
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ejecutar_backend:
        description: '¿Ejecutar pruebas de Backend / API (Postman Collections)?'
        required: true
        type: boolean
        default: true
      ejecutar_interfaz:
        description: '¿Ejecutar pruebas de interfaz (Aceptación / E2E)?'
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # FASE 1: PRUEBAS UNITARIAS (Rápidas, aisladas con mocks de PDO)
  # ===========================================================================
  unit-tests:
    name: Pruebas Unitarias (PHPUnit)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, gd, pdo, pdo_mysql, curl, dom, xml, zip
          coverage: none

      - name: Obtener directorio de caché de Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cachear dependencias de Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Configurar archivo .env
        run: cp .env.example .env

      - name: Instalar dependencias con Composer
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Crear directorios temporales requeridos
        run: mkdir -p logs backups storage

      - name: Ejecutar suite de pruebas unitarias
        run: vendor/bin/phpunit --testsuite Unit --colors=always

  # ===========================================================================
  # FASE 2: PRUEBAS DE HUMO E INTEGRACIÓN (MySQL 8.0 real y servidor PHP)
  # ===========================================================================
  integration-and-smoke-tests:
    name: Pruebas de Humo e Integración (BD Real)
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, gd, pdo, pdo_mysql, curl, dom, xml, zip
          coverage: none

      - name: Obtener directorio de caché de Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cachear dependencias de Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Configurar variables de entorno (.env) para CI
        run: |
          cp .env.example .env
          sed -i 's/DB_HOST_SG=127.0.0.1/DB_HOST_SG=127.0.0.1/g' .env
          sed -i 's/DB_HOST=127.0.0.1/DB_HOST=127.0.0.1/g' .env
          sed -i 's/DB_USER_SG=root/DB_USER_SG=root/g' .env
          sed -i 's/DB_USER=root/DB_USER=root/g' .env
          sed -i 's/DB_PASS_SG=root/DB_PASS_SG=root/g' .env
          sed -i 's/DB_PASS=root/DB_PASS=root/g' .env

      - name: Instalar dependencias con Composer
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Crear directorios del sistema
        run: mkdir -p logs backups storage public/img/usuarios public/img/atletas public/docs/reportes

      - name: Cargar bases de datos MySQL (bds2 y cannibalsbd2)
        run: |
          mysql -h 127.0.0.1 -u root -proot < bds2.sql
          mysql -h 127.0.0.1 -u root -proot < cannibalsbd2.sql

      - name: Iniciar servidor web PHP incorporado
        run: |
          php -S 127.0.0.1:8000 -t public public/router.php > /dev/null 2>&1 &
          sleep 2

      - name: Ejecutar pruebas de Humo (Smoke Tests)
        env:
          APP_URL: http://127.0.0.1:8000
        run: vendor/bin/phpunit --testsuite Smoke --colors=always

      - name: Ejecutar pruebas de Integración
        run: vendor/bin/phpunit --testsuite Integration --colors=always

  # ===========================================================================
  # FASE 3: PRUEBAS DE BACKEND / API (Colecciones Postman con Newman)
  # ===========================================================================
  backend-api-tests:
    name: 📮 Pruebas de Backend / API (Postman)
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name != 'workflow_dispatch' || inputs.ejecutar_backend == true
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, gd, pdo, pdo_mysql, curl, dom, xml, zip
          coverage: none

      - name: Configurar Node.js (v20) para Newman
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Newman
        run: npm install -g newman

      - name: Obtener directorio de caché de Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cachear dependencias de Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Configurar variables de entorno (.env) para CI
        run: |
          cp .env.example .env
          sed -i 's/DB_HOST_SG=127.0.0.1/DB_HOST_SG=127.0.0.1/g' .env
          sed -i 's/DB_HOST=127.0.0.1/DB_HOST=127.0.0.1/g' .env
          sed -i 's/DB_USER_SG=root/DB_USER_SG=root/g' .env
          sed -i 's/DB_USER=root/DB_USER=root/g' .env
          sed -i 's/DB_PASS_SG=root/DB_PASS_SG=root/g' .env
          sed -i 's/DB_PASS=root/DB_PASS=root/g' .env

      - name: Instalar dependencias con Composer
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Crear directorios del sistema
        run: mkdir -p logs backups storage public/img/usuarios public/img/atletas public/docs/reportes

      - name: Cargar bases de datos MySQL (bds2 y cannibalsbd2)
        run: |
          mysql -h 127.0.0.1 -u root -proot < bds2.sql
          mysql -h 127.0.0.1 -u root -proot < cannibalsbd2.sql

      - name: Iniciar servidor web PHP incorporado
        run: |
          php -S 127.0.0.1:8000 -t public public/router.php > /dev/null 2>&1 &
          sleep 2

      - name: Ejecutar colecciones de Postman (Backend API)
        run: |
          ENV_FILE="tests/Backend/Hockey-Cannibals Lara - Local Environment.postman_environment.json"

          # 1. Colección de Inicio (Login y obtención de CSRF)
          if [ -f "tests/Backend/Hockey-Cannibals-Lara-Inicio.postman_collection.json" ]; then
            echo "::group::Ejecutando Postman: Inicio"
            newman run "tests/Backend/Hockey-Cannibals-Lara-Inicio.postman_collection.json" \
              -e "$ENV_FILE" \
              --env-var "url_base=http://127.0.0.1:8000/" \
              --reporters cli
            echo "::endgroup::"
          fi

          # 2. Resto de módulos funcionales
          for col in tests/Backend/*.postman_collection.json; do
            if [ "$col" != "tests/Backend/Hockey-Cannibals-Lara-Inicio.postman_collection.json" ]; then
              nombre=$(basename "$col" .postman_collection.json)
              echo "::group::Ejecutando Postman: $nombre"
              newman run "$col" \
                -e "$ENV_FILE" \
                --env-var "url_base=http://127.0.0.1:8000/" \
                --reporters cli || true
              echo "::endgroup::"
            fi
          done

  # ===========================================================================
  # FASE 4: PRUEBAS DE INTERFAZ / E2E (Codeception + ChromeDriver Headless)
  # ===========================================================================
  acceptance-tests:
    name: 🌐 Pruebas de Interfaz (Aceptación / E2E)
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name != 'workflow_dispatch' || inputs.ejecutar_interfaz == true
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, gd, pdo, pdo_mysql, curl, dom, xml, zip
          coverage: none

      - name: Obtener directorio de caché de Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cachear dependencias de Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Configurar variables de entorno (.env) para CI
        run: |
          cp .env.example .env
          sed -i 's/DB_HOST_SG=127.0.0.1/DB_HOST_SG=127.0.0.1/g' .env
          sed -i 's/DB_HOST=127.0.0.1/DB_HOST=127.0.0.1/g' .env
          sed -i 's/DB_USER_SG=root/DB_USER_SG=root/g' .env
          sed -i 's/DB_USER=root/DB_USER=root/g' .env
          sed -i 's/DB_PASS_SG=root/DB_PASS_SG=root/g' .env
          sed -i 's/DB_PASS=root/DB_PASS=root/g' .env

      - name: Instalar dependencias con Composer
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Crear directorios del sistema y salida de Codeception
        run: mkdir -p logs backups storage tests/_output public/img/usuarios public/img/atletas public/docs/reportes

      - name: Cargar bases de datos MySQL (bds2 y cannibalsbd2)
        run: |
          mysql -h 127.0.0.1 -u root -proot < bds2.sql
          mysql -h 127.0.0.1 -u root -proot < cannibalsbd2.sql

      - name: Configurar e iniciar ChromeDriver
        run: |
          if ! command -v chromedriver &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y chromium-chromedriver
            sudo ln -sf /usr/lib/chromium-browser/chromedriver /usr/local/bin/chromedriver || true
          fi
          chromedriver --port=9515 &
          sleep 2

      - name: Iniciar servidor web PHP incorporado
        run: |
          php -S 127.0.0.1:8000 -t public public/router.php > /dev/null 2>&1 &
          sleep 2

      - name: Ejecutar pruebas de Aceptación (Codeception)
        run: vendor/bin/codecept run Acceptance --env ci --steps

      - name: Subir artefactos en caso de fallos (Capturas y HTML)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-fallo-interfaz
          path: tests/_output/
          retention-days: 7
